<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Management - DriveRentals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;

            background:
                linear-gradient(
                    rgba(5,20,45,0.75),
                    rgba(5,20,45,0.75)
                ),
                url("../assets/images/vehi-maintan.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

    </style>
</head>
<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Vehicle Maintenance</h2>
        <!-- Button to open the Log Maintenance Modal -->
        <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#logMaintenanceModal">+ Log Maintenance</button>
    </div>

    <!-- Maintenance Data Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Service ID</th>
                    <th>Vehicle Details</th>
                    <th>Service Date</th>
                    <th>Odometer</th>
                    <th>Cost</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="maintenance-table">
                <tr><td colspan="7" class="text-center text-muted">Loading maintenance records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Log Maintenance Modal -->
<div class="modal fade" id="logMaintenanceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Log Service Appointment</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="logMaintenanceForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Vehicle</label>
                        <select class="form-select" id="vehicleId" required><option value="">Select vehicle</option></select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Service Date</label>
                            <input type="date" class="form-control" id="serviceDate" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" id="serviceStatus">
                                <option value="SCHEDULED">Scheduled</option>
                                <option value="IN_PROGRESS">In Progress</option>
                                <option value="COMPLETED">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Odometer Reading (km)</label>
                            <input type="number" class="form-control" id="odometerReading" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Cost (LKR)</label>
                            <input type="number" class="form-control" id="serviceCost" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-accent">Save Record</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/maintenance.js"></script>
</body>
</html>
