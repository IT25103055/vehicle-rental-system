<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotions Management - DriveRentals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">

    <style>

        body {
            min-height: 100vh;
            margin: 0;

            background:
                linear-gradient(
                    rgba(5,20,45,0.75),
                    rgba(5,20,45,0.75)
                ),
                url("../assets/images/promo.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

    </style>
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Promotions & Discounts</h2>
        <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#addPromoModal">+ Create Promo Code</button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Promo Code</th>
                    <th>Discount (%)</th>
                    <th>Valid Until</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="promo-table">
                <tr><td colspan="4" class="text-center text-muted">Loading promotions...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Promo Modal -->
<div class="modal fade" id="addPromoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Create Promo Code</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="addPromoForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Promo Code (e.g., SUMMER20)</label>
                        <input type="text" class="form-control text-uppercase" id="promoCode" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Discount Percentage (%)</label>
                        <input type="number" class="form-control" id="discountPercentage" min="1" max="100" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Expiration Date</label>
                        <input type="date" class="form-control" id="endDate" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-accent">Save Promotion</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/promotions.js"></script>
</body>
</html>
