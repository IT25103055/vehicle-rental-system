<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Branch Management - DriveRentals</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet" href="../assets/css/style.css">



    <style>

        body {

            min-height:100vh;
            margin:0;

            background:
                linear-gradient(
                    rgba(5,20,45,0.75),
                    rgba(5,20,45,0.75)
                ),
                url("../assets/images/branches.jpg");


            background-size:cover;

            background-position:center;

            background-repeat:no-repeat;

            background-attachment:fixed;

        }




        .branch-management-container {


            background:rgba(255,255,255,0.93);

            border-radius:20px;

            padding:35px;

            margin-top:40px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);

        }




        h2 {

            color:#071a3d;

            font-weight:800;

        }



        .card {

            border-radius:15px;

        }



        .table {

            margin-bottom:0;

        }


    </style>


</head>



<body>


<div id="navbar-placeholder"></div>




<div class="container mt-5">


    <div class="branch-management-container">



        <div class="d-flex justify-content-between align-items-center mb-4">


            <h2 class="fw-bold">
                Location & Branch Management
            </h2>



            <button class="btn btn-accent"
                    data-bs-toggle="modal"
                    data-bs-target="#addBranchModal">

                + Add New Branch

            </button>


        </div>





        <div class="card shadow-sm border-0">


            <div class="card-body">


                <table class="table table-hover align-middle">


                    <thead class="table-light">

                    <tr>

                        <th>Branch ID</th>

                        <th>Name</th>

                        <th>Address</th>

                        <th>Vehicle Capacity</th>

                        <th class="text-end">Actions</th>

                    </tr>

                    </thead>



                    <tbody id="branch-table">


                    <tr>

                        <td colspan="5"
                            class="text-center text-muted">

                            Loading branches...

                        </td>

                    </tr>


                    </tbody>


                </table>


            </div>


        </div>



    </div>


</div>





<!-- Add Branch Modal -->

<div class="modal fade" id="addBranchModal" tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title">
                    Add New Branch
                </h5>


                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">

                </button>


            </div>





            <form id="addBranchForm">


                <div class="modal-body">


                    <div class="mb-3">

                        <label class="form-label">
                            Branch Name
                        </label>

                        <input type="text"
                               class="form-control"
                               id="branchName"
                               required>

                    </div>




                    <div class="mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <input type="text"
                               class="form-control"
                               id="branchAddress"
                               required>

                    </div>




                    <div class="row">


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Contact Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="branchContact"
                                   required>

                        </div>



                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Operating Hours
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="branchHours"
                                   required>

                        </div>


                    </div>





                    <div class="mb-3">

                        <label class="form-label">
                            Max Vehicle Capacity
                        </label>

                        <input type="number"
                               class="form-control"
                               id="branchCapacity"
                               required>

                    </div>



                </div>





                <div class="modal-footer">


                    <button type="button"
                            class="btn btn-light"
                            data-bs-dismiss="modal">

                        Cancel

                    </button>



                    <button type="submit"
                            class="btn btn-accent">

                        Save Branch

                    </button>


                </div>


            </form>


        </div>


    </div>


</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script src="../assets/js/auth.js"></script>

<script src="../assets/js/components.js"></script>

<script src="../assets/js/branches.js"></script>



</body>

</html>
