<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Management - DriveRentals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<!-- Navbar -->
<div id="navbar-placeholder"></div>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Rental Contracts</h2>
        <!-- Button to open the Generate Contract Modal -->
        <button class="btn btn-accent" data-bs-toggle="modal" data-bs-target="#generateContractModal">+ Generate Contract</button>
    </div>

    <!-- Contracts Data Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Contract ID</th>
                    <th>Booking Ref</th>
                    <th>Driver Name</th>
                    <th>License No.</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="contracts-table">
                <tr><td colspan="6" class="text-center text-muted">Loading contracts...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Generate Contract Modal -->
<div class="modal fade" id="generateContractModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Generate Rental Contract</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="generateContractForm">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Booking ID</label>
                        <input type="number" class="form-control" id="bookingId" placeholder="Enter Confirmed Booking ID" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Primary Driver Name</label>
                        <input type="text" class="form-control" id="driverName" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">License Number</label>
                            <input type="text" class="form-control" id="licenseNumber" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">NIC / Passport</label>
                            <input type="text" class="form-control" id="identityDocument" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contact Details</label>
                        <input type="text" class="form-control" id="contactDetails" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-accent">Create Contract</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/contracts.js"></script>
</body>
</html>
