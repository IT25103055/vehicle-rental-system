<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Reservations - DriveRentals</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet" href="../assets/css/style.css">


    <style>

        body {

            min-height: 100vh;
            margin: 0;

            background:
                linear-gradient(
                    rgba(5,20,45,0.75),
                    rgba(5,20,45,0.75)
                ),
                url("../assets/images/reservation.jpg");


            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

        }



        .reservation-container {

            background: rgba(255,255,255,0.93);

            border-radius: 20px;

            padding: 35px;

            margin-top: 40px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);

        }



        .reservation-card {

            background: rgba(255,255,255,0.95);

            border-radius: 15px;

            border: none;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);

        }



        h2 {

            color:#071a3d;

            font-weight:800;

        }


    </style>


</head>


<body>


<!-- Reusable Navbar -->

<div id="navbar-placeholder"></div>



<div class="container mt-5">


    <div class="reservation-container">


        <div class="d-flex justify-content-between align-items-center mb-4">


            <h2 class="fw-bold mb-0">
                My Reservations
            </h2>



            <a href="vehicles.html"
               class="btn btn-outline-primary">

                Book Another Vehicle

            </a>


        </div>





        <!-- JavaScript will inject booking cards here -->

        <div class="row" id="reservations-container">


            <div class="col-12 text-center text-muted mt-5">


                <div class="spinner-border text-primary"
                     role="status">
                </div>


                <p class="mt-2">
                    Loading your reservations...
                </p>


            </div>


        </div>



    </div>


</div>





<!-- Bootstrap & Custom JS -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>


<script src="../assets/js/auth.js">
</script>


<script src="../assets/js/components.js">
</script>


<script src="../assets/js/reservations.js">
</script>



</body>

</html>
