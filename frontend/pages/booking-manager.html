<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Booking Management - Nima Vehicle Rental</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet" href="../assets/css/style.css">



    <style>


        body.staff-page {


            min-height:100vh;

            margin:0;


            background:

                linear-gradient(
                    rgba(5,20,45,0.75),
                    rgba(5,20,45,0.75)
                ),

                url("../assets/images/booking_st.jpg");



            background-size:cover;


            background-position:center;


            background-repeat:no-repeat;


            background-attachment:fixed;


        }




        .booking-management-container {


            background:rgba(255,255,255,0.93);


            border-radius:20px;


            padding:35px;


            box-shadow:

                0 20px 50px rgba(0,0,0,0.25);


        }



        .section-title {


            color:#071a3d;

            font-weight:800;

        }



        .module-card {


            border-radius:15px;

            overflow:hidden;

        }



    </style>



</head>



<body class="staff-page">



<div id="navbar-placeholder"></div>



<main class="container-fluid px-4 py-5">



    <div class="booking-management-container">



        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">


            <div>

                <p class="text-secondary small fw-bold text-uppercase mb-1"
                   id="staffNameDisplay">

                    Booking team

                </p>


                <h1 class="section-title h3 mb-0">

                    Manage Customer Bookings

                </h1>


            </div>




            <button class="btn btn-navy"
                    onclick="fetchBookings()">

                Refresh list

            </button>



        </div>






        <div class="card module-card">


            <div class="card-body p-0">


                <div class="table-responsive">


                    <table class="table table-hover align-middle mb-0">


                        <thead class="table-light">


                        <tr>

                            <th class="px-4 py-3">
                                Reference
                            </th>


                            <th>
                                Customer
                            </th>


                            <th>
                                Vehicle
                            </th>


                            <th>
                                Pickup
                            </th>


                            <th>
                                Return
                            </th>


                            <th>
                                Status
                            </th>


                            <th class="text-end px-4">
                                Actions
                            </th>


                        </tr>


                        </thead>



                        <tbody id="bookingsTableBody">


                        <tr>

                            <td colspan="7"
                                class="text-center py-5 text-secondary">

                                Loading bookings...

                            </td>


                        </tr>


                        </tbody>


                    </table>



                </div>


            </div>


        </div>



    </div>


</main>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script src="../assets/js/auth.js"></script>

<script src="../assets/js/components.js"></script>

<script src="../assets/js/booking-manager.js"></script>



</body>

</html>
